bot:
  name: "Scalper Bot"
  mode: "demo"
  broker: "paper"
  symbol: "EURUSD"
  poll_seconds: 5

trade_parameters:
  market: "forex"
  trade_type: "scalping"
  contract_type: "both"
  candle_interval: 60

initial_settings:
  initial_amount: 3.0
  win_amount: 3.0
  expected_profit: 700.0
  stop_loss: 100.0
  martingale_level: 1.05
  max_martingale_steps: 3

risk:
  starting_balance: 1000.0
  max_trade_risk_percent: 1.0
  max_daily_loss: 100.0
  max_open_positions: 1
  cooldown_seconds: 60

strategy:
  fast_ema: 5
  slow_ema: 13
  rsi_period: 7
  rsi_oversold: 30
  rsi_overbought: 70
  minimum_confidence: 0.60

notifications:
  mode: "silent"
  status_check_interval: 30
